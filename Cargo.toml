[package]
name = "yawsf"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
arc-swap = "1.9.2"
clap = { version = "4.6.1", features = ["derive"] }
gtk4 = { version = "0.11.4", features = ["gnome_50", "v4_22"] }
gtk4-layer-shell = { version = "0.8.0", features = ["v1_3"] }
gtk4-session-lock = { version = "0.4.0", features = ["v1_2"] }
rand = "0.10.2"
libc = "0.2.186"
reqwest = { version = "0.13.4", features = ["json"] }
rocket = "0.5.1"
serde = { version = "1.0.228", features = ["derive"] }
shell-words = "1.1.0"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["full"] }
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "5.5.0", features = ["rocket_extras"] }
utoipa-scalar = { version = "0.3.0", features = ["rocket"] }
webkit6 = { version = "0.6.1", features = ["gtk_v4_18", "v2_52"] }

[patch.crates-io]
utoipa = {
	# https://github.com/juhaku/utoipa/pull/1555, for webhooks
	git = "https://github.com/pjankiewicz/utoipa",
	rev = "a6bd04448900b25d8fa372cae74727b71cd7c7da",
}
